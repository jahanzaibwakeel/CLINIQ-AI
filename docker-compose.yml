services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinik
      POSTGRES_PASSWORD: clinik
      POSTGRES_DB: clinik_ai
    ports:
      - "${POSTGRES_HOST_PORT:?Set POSTGRES_HOST_PORT in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinik -d clinik_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "${VALKEY_HOST_PORT:?Set VALKEY_HOST_PORT in .env}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "${OLLAMA_HOST_PORT:?Set OLLAMA_HOST_PORT in .env}:11434"
    volumes:
      - ollama_data:/root/.ollama

  web:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://clinik:clinik@postgres:5432/clinik_ai?schema=public
      VALKEY_URL: redis://valkey:6379
      PORT: ${APP_CONTAINER_PORT:?Set APP_CONTAINER_PORT in .env}
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:?Set TRUSTED_ORIGINS in .env}
      SESSION_SECRET: replace-this-in-production-with-a-long-random-secret
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-220}
      OLLAMA_REQUEST_TIMEOUT_MS: ${OLLAMA_REQUEST_TIMEOUT_MS:-1500}
      ALLOW_EXTERNAL_AI: "false"
    ports:
      - "${APP_HOST_PORT:?Set APP_HOST_PORT in .env}:${APP_CONTAINER_PORT:?Set APP_CONTAINER_PORT in .env}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const port = process.env.PORT; if (!port) process.exit(1); fetch('http://127.0.0.1:' + port + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  ollama_data:
