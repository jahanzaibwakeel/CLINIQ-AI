name: MediPilot AI CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to VPS when production secrets are configured"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: medipilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"
  SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  AI_PROVIDER: fallback
  ALLOW_EXTERNAL_AI: "false"
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  TRUSTED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
  DATABASE_URL: postgresql://medipilot:medipilot@127.0.0.1:5432/medipilot_ai?schema=public
  VALKEY_URL: redis://127.0.0.1:6379

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test -- --reporter=default --reporter=json --outputFile=vitest-report.json

      - name: Production configuration check
        run: npm run release:check

      - name: Dependency audit report
        run: npm audit --audit-level=high --omit=optional --json > npm-audit.json
        continue-on-error: true

      - name: Production build
        run: npm run build

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            vitest-report.json
            npm-audit.json
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Database Integration
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medipilot
          POSTGRES_PASSWORD: medipilot
          POSTGRES_DB: medipilot_ai
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U medipilot -d medipilot_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://medipilot:medipilot@127.0.0.1:${{ job.services.postgres.ports[5432] }}/medipilot_ai?schema=public
      VALKEY_URL: redis://127.0.0.1:${{ job.services.valkey.ports[6379] }}
      RUN_INTEGRATION_TESTS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run tenant-isolation integration tests
        run: npm run test:integration

  browser-smoke:
    name: Browser Smoke
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medipilot
          POSTGRES_PASSWORD: medipilot
          POSTGRES_DB: medipilot_ai
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U medipilot -d medipilot_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://medipilot:medipilot@127.0.0.1:${{ job.services.postgres.ports[5432] }}/medipilot_ai?schema=public
      VALKEY_URL: redis://127.0.0.1:${{ job.services.valkey.ports[6379] }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PORT: "3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop browser smoke suite
        run: npm run test:e2e -- --project=desktop-chrome

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [quality, integration, browser-smoke]
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.image }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve GHCR image name
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Optional VPS Deploy
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event.inputs.deploy == 'true' || github.event_name == 'push')
    environment: production

    steps:
      - name: Check deployment secrets
        id: secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [[ -n "$VPS_HOST" && -n "$VPS_USER" && -n "$VPS_SSH_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "VPS deploy skipped because VPS_HOST, VPS_USER, or VPS_SSH_KEY is not configured."
          fi

      - name: Deploy over SSH
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.docker.outputs.image }}:latest
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE,APP_DIR,GHCR_USERNAME,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/opt/medipilot-ai}"
            cd "$APP_DIR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker pull "$IMAGE"
            export MEDIPILOT_IMAGE="$IMAGE"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T web npm run db:deploy
            docker compose -f docker-compose.prod.yml exec -T web node -e "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/ready').then(r => { if (!r.ok) process.exit(1); console.log('ready') }).catch(() => process.exit(1))"
            APP_PORT="$(docker compose -f docker-compose.prod.yml exec -T web node -e "process.stdout.write(process.env.PORT || '3000')")"
            docker compose -f docker-compose.prod.yml exec -T -e PRODUCTION_CHECK_URL="http://127.0.0.1:${APP_PORT}" web node scripts/production-check.mjs

  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [quality, integration, browser-smoke, docker, deploy-vps]
    if: always()

    steps:
      - name: Write run summary
        shell: bash
        run: |
          {
            echo "## MediPilot AI CI/CD Summary"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Quality gate | ${{ needs.quality.result }} |"
            echo "| Database integration | ${{ needs.integration.result }} |"
            echo "| Browser smoke | ${{ needs.browser-smoke.result }} |"
            echo "| Docker image | ${{ needs.docker.result }} |"
            echo "| VPS deploy | ${{ needs.deploy-vps.result }} |"
            echo ""
            echo "Image target: \`${{ needs.docker.outputs.image || 'not built' }}\`"
            echo ""
            echo "Clinical safety posture: local-first AI, external AI disabled by default, doctor review required for AI outputs."
          } >> "$GITHUB_STEP_SUMMARY"
