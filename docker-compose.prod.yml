services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medipilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-medipilot_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medipilot} -d ${POSTGRES_DB:-medipilot_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${MEDIPILOT_IMAGE:-medipilot-ai:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      PORT: ${APP_CONTAINER_PORT:?Set APP_CONTAINER_PORT}
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      DATABASE_URL: postgresql://${POSTGRES_USER:-medipilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medipilot_ai}?schema=public
      VALKEY_URL: redis://valkey:6379
      SESSION_SECRET: ${SESSION_SECRET}
      DOCUMENT_STORAGE_DIR: ${DOCUMENT_STORAGE_DIR:-/app/uploads}
      DOCUMENT_MAX_UPLOAD_BYTES: ${DOCUMENT_MAX_UPLOAD_BYTES:-2000000}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-220}
      OLLAMA_REQUEST_TIMEOUT_MS: ${OLLAMA_REQUEST_TIMEOUT_MS:-1500}
      ALLOW_EXTERNAL_AI: ${ALLOW_EXTERNAL_AI:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-70b-versatile}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-MediPilot AI <no-reply@medipilot.local>}
      ACCOUNT_TOKEN_RETENTION_DAYS: ${ACCOUNT_TOKEN_RETENTION_DAYS:-7}
    volumes:
      - uploads_data:${DOCUMENT_STORAGE_DIR:-/app/uploads}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HOST_PORT:?Set APP_HOST_PORT}:${APP_CONTAINER_PORT:?Set APP_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const port = process.env.PORT; if (!port) process.exit(1); fetch('http://localhost:' + port + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      APP_CONTAINER_PORT: ${APP_CONTAINER_PORT:?Set APP_CONTAINER_PORT}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  valkey_data:
  ollama_data:
  uploads_data:
  caddy_data:
  caddy_config:
