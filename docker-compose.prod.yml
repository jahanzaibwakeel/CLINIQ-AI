services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medipilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-medipilot_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medipilot} -d ${POSTGRES_DB:-medipilot_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${MEDIPILOT_IMAGE:-medipilot-ai:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      PORT: ${APP_CONTAINER_PORT:?Set APP_CONTAINER_PORT}
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-medipilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medipilot_ai}?schema=public
      VALKEY_URL: redis://valkey:6379
      SESSION_SECRET: ${SESSION_SECRET}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-220}
      ALLOW_EXTERNAL_AI: ${ALLOW_EXTERNAL_AI:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-MediPilot AI <no-reply@medipilot.local>}
      ACCOUNT_TOKEN_RETENTION_DAYS: ${ACCOUNT_TOKEN_RETENTION_DAYS:-7}
    ports:
      - "${APP_HOST_PORT:?Set APP_HOST_PORT}:${APP_CONTAINER_PORT:?Set APP_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const port = process.env.PORT; if (!port) process.exit(1); fetch('http://localhost:' + port + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  valkey_data:
  ollama_data:
